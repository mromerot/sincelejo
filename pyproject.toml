[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eva-sincelejo"
version = "0.1.0"
description = "Análisis reproducible de amenazas y riesgos de Sincelejo"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "matplotlib>=3.8"]

[project.optional-dependencies]
libro = ["nbformat>=5.10", "nbclient>=0.10", "ipykernel>=6.29", "PyYAML>=6", "tabulate>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]
